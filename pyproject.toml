[project]
name = "voice-encryption"
version = "0.1.0"
description = "Voice identification system with encrypted voiceprints"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Lightweight core: API + worker when USE_MODAL_GPU=true (ML runs on Modal).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "cryptography==43.0.3",
    "pymongo==4.9.2",
    "numpy>=2.1.3",
    "soundfile>=0.13.1",
    "python-dotenv==1.0.1",
    "modal",
    # Trust the Windows certificate store (TLS-inspecting corporate/antivirus proxies)
    "pip-system-certs==5.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only needed to run diarization/transcription/embedding locally (USE_MODAL_GPU=false).
# Install with: uv sync --extra local-ml
local-ml = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "pyannote.audio==3.3.2",
    # pyannote.audio 3.3.2 calls hf_hub_download(..., use_auth_token=...), removed in huggingface_hub>=1.0
    "huggingface_hub==0.25.2",
    "speechbrain==1.0.2",
    "openai-whisper==20250625",
]

[tool.uv]
package = false
# openai-whisper pulls in triton (~1GB, GPU-only kernels) -- useless on CPU.
override-dependencies = ["triton; sys_platform == 'never'"]

# CPU-only torch wheels on Linux (much smaller than the default CUDA build)
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
