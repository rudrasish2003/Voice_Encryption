<!-- ================= TAB 1: LOGIN COMPONENT ================= -->
<section id="tab-login" class="tab-view active" role="tabpanel" aria-labelledby="tab-btn-login">
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-header">
        <div class="login-shield-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2>Account Authentication</h2>
        <p class="subtitle">Sign in to register voices, browse the library, and run identification.</p>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="login-username">Username</label>
          <div class="input-icon-wrapper">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="login-username" name="username" placeholder="admin" required />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="login-password">Password</label>
          </div>
          <div class="input-icon-wrapper">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="login-password" name="password" placeholder="••••••••••••" required />
            <button type="button" class="password-toggle" id="toggle-password" title="Toggle password visibility" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9.88 9.88 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="custom-checkbox">
            <input type="checkbox" id="remember-me" checked />
            <span class="checkmark"></span>
            <span>Keep session active</span>
          </label>
          <button type="button" class="btn-text-link" id="btn-fill-demo">Fill Username Only</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">
          <span>Sign In to Studio</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="login-footer">
        <span class="security-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Session token stored only in this browser
        </span>
      </div>
    </div>
  </div>
</section>
